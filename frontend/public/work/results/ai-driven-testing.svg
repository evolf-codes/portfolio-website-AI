<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">AI-assisted QA workflow</title>
  <desc id="desc">Daily AI stack for QA: Claude, Cursor, Codex, ChatGPT, skills, agents, Markdown, and end-to-end coverage from API to UI.</desc>
  <rect width="1280" height="760" fill="#0f1419"/>
  <rect x="40" y="40" width="1200" height="680" rx="20" fill="#171c22" stroke="#2a323c"/>

  <text x="72" y="100" fill="#8b95a5" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">AI QUALITY ENGINEERING · DAILY WORKFLOW</text>
  <text x="72" y="150" fill="#f3f5f7" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">From backend through GUI</text>
  <text x="72" y="188" fill="#b7c0cc" font-family="Arial, Helvetica, sans-serif" font-size="18">I use AI every day to plan tests, find coverage gaps, and ship faster with judgment.</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="72" y="230" width="170" height="64" rx="12" fill="#1f2a24" stroke="#3d6b4f"/>
    <text x="92" y="270" fill="#9fe0b8" font-size="18" font-weight="700">Claude</text>
    <rect x="260" y="230" width="170" height="64" rx="12" fill="#1f2633" stroke="#3d5a80"/>
    <text x="290" y="270" fill="#9ec5ff" font-size="18" font-weight="700">Cursor</text>
    <rect x="448" y="230" width="170" height="64" rx="12" fill="#2a2430" stroke="#6b4f80"/>
    <text x="478" y="270" fill="#d2b4ff" font-size="18" font-weight="700">Codex</text>
    <rect x="636" y="230" width="190" height="64" rx="12" fill="#243028" stroke="#4f6b3d"/>
    <text x="666" y="270" fill="#c6e89a" font-size="18" font-weight="700">ChatGPT</text>
    <rect x="844" y="230" width="170" height="64" rx="12" fill="#302820" stroke="#80603d"/>
    <text x="874" y="270" fill="#ffd29a" font-size="18" font-weight="700">Agents</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="72" y="330" width="360" height="280" rx="16" fill="#12171d" stroke="#2a323c"/>
    <text x="96" y="372" fill="#f3f5f7" font-size="20" font-weight="700">Skills · Markdown · Agents</text>
    <text x="96" y="412" fill="#b7c0cc" font-size="15">SKILL.md playbooks</text>
    <text x="96" y="442" fill="#b7c0cc" font-size="15">Reusable agent instructions</text>
    <text x="96" y="472" fill="#b7c0cc" font-size="15">Prompted QA workflows</text>
    <text x="96" y="502" fill="#b7c0cc" font-size="15">Built custom tooling</text>
    <text x="96" y="532" fill="#b7c0cc" font-size="15">Built this portfolio site</text>
    <text x="96" y="574" fill="#9fe0b8" font-size="14" font-weight="700">Repeatable · reviewable · owned by QA</text>

    <rect x="460" y="330" width="360" height="280" rx="16" fill="#12171d" stroke="#2a323c"/>
    <text x="484" y="372" fill="#f3f5f7" font-size="20" font-weight="700">Where AI helps</text>
    <text x="484" y="412" fill="#b7c0cc" font-size="15">Test plan drafts</text>
    <text x="484" y="442" fill="#b7c0cc" font-size="15">Coverage gap analysis</text>
    <text x="484" y="472" fill="#b7c0cc" font-size="15">Requirement → case matrix</text>
    <text x="484" y="502" fill="#b7c0cc" font-size="15">Google Sheets tracking</text>
    <text x="484" y="532" fill="#b7c0cc" font-size="15">Risk notes for release</text>
    <text x="484" y="574" fill="#9ec5ff" font-size="14" font-weight="700">Human gate on every decision</text>

    <rect x="848" y="330" width="352" height="280" rx="16" fill="#12171d" stroke="#2a323c"/>
    <text x="872" y="372" fill="#f3f5f7" font-size="20" font-weight="700">End-to-end scope</text>
    <text x="872" y="422" fill="#9ec5ff" font-size="16" font-weight="700">1 · API / services</text>
    <text x="872" y="458" fill="#d2b4ff" font-size="16" font-weight="700">2 · Data &amp; contracts</text>
    <text x="872" y="494" fill="#ffd29a" font-size="16" font-weight="700">3 · Integration paths</text>
    <text x="872" y="530" fill="#9fe0b8" font-size="16" font-weight="700">4 · GUI validation</text>
    <text x="872" y="574" fill="#b7c0cc" font-size="14">One story · full stack confidence</text>
  </g>

  <text x="72" y="670" fill="#8b95a5" font-family="Arial, Helvetica, sans-serif" font-size="13">Illustrative workflow panel · paired with sample artifacts below</text>
</svg>
