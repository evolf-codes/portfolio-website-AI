<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Passing Locust Restful Booker performance test</title>
  <desc id="desc">Locust report showing 61 requests, 4.48 req/s, 190 ms p95, 0% failures, and a pass release decision.</desc>
  <rect width="1280" height="760" rx="24" fill="#e8ecef"/>
  <g transform="translate(32, 32) scale(0.95)">
    <rect width="1280" height="760" rx="24" fill="#0d1012"/>
    <rect width="1280" height="62" rx="24" fill="#1c2126"/>
    <rect y="38" width="1280" height="24" fill="#1c2126"/>
    <circle cx="30" cy="30" r="7" fill="#6e7479"/>
    <circle cx="54" cy="30" r="7" fill="#6e7479"/>
    <circle cx="78" cy="30" r="7" fill="#6e7479"/>
    <text x="640" y="37" text-anchor="middle" fill="#d9dddf" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">performance-testing - Locust Restful Booker gate</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text x="36" y="108" fill="#9fa6ab" font-size="15">$ locust -f locustfile.py --headless -u 4 -r 1 -t 30s</text>
      <text x="36" y="138" fill="#d9dddf" font-size="15">target: https://restful-booker.herokuapp.com - max 4 VUs</text>
      <rect x="36" y="168" width="292" height="128" rx="12" fill="#15191e" stroke="#30363b"/>
      <rect x="344" y="168" width="292" height="128" rx="12" fill="#15191e" stroke="#30363b"/>
      <rect x="652" y="168" width="292" height="128" rx="12" fill="#15191e" stroke="#30363b"/>
      <rect x="960" y="168" width="284" height="128" rx="12" fill="#15191e" stroke="#30363b"/>
      <text x="56" y="206" fill="#9fa6ab" font-size="14">REQUESTS</text>
      <text x="56" y="258" fill="#d9dddf" font-size="36" font-weight="700">61</text>
      <text x="364" y="206" fill="#9fa6ab" font-size="14">THROUGHPUT</text>
      <text x="364" y="258" fill="#d9dddf" font-size="36" font-weight="700">4.48</text>
      <text x="500" y="258" fill="#9fa6ab" font-size="14">req/s</text>
      <text x="672" y="206" fill="#9fa6ab" font-size="14">P95 LATENCY</text>
      <text x="672" y="258" fill="#d9dddf" font-size="36" font-weight="700">190</text>
      <text x="780" y="258" fill="#9fa6ab" font-size="14">ms</text>
      <text x="980" y="206" fill="#9fa6ab" font-size="14">ERROR RATE</text>
      <text x="980" y="258" fill="#d9dddf" font-size="36" font-weight="700">0.00%</text>
      <text x="36" y="348" fill="#d9dddf" font-size="16" font-weight="700">Release objectives</text>
      <line x1="36" y1="368" x2="1244" y2="368" stroke="#30363b"/>
      <text x="36" y="412" fill="#63d792" font-size="16" font-weight="700">PASS</text>
      <text x="110" y="412" fill="#d9dddf" font-size="16">p95 latency &lt; 3000 ms</text>
      <text x="36" y="456" fill="#63d792" font-size="16" font-weight="700">PASS</text>
      <text x="110" y="456" fill="#d9dddf" font-size="16">HTTP errors &lt; 5%</text>
      <text x="36" y="500" fill="#63d792" font-size="16" font-weight="700">PASS</text>
      <text x="110" y="500" fill="#d9dddf" font-size="16">Booking JSON contracts validated</text>
      <text x="36" y="544" fill="#63d792" font-size="16" font-weight="700">PASS</text>
      <text x="110" y="544" fill="#d9dddf" font-size="16">Throughput &gt;= 0.5 req/s</text>
      <line x1="36" y1="590" x2="1244" y2="590" stroke="#30363b"/>
      <text x="36" y="640" fill="#63d792" font-size="21" font-weight="700">gate passed</text>
      <text x="220" y="640" fill="#9fa6ab" font-size="15">61 requests - 190 ms p95 - 0 failures</text>
      <text x="36" y="688" fill="#9fa6ab" font-size="15">Light public practice load - clear pass/fail thresholds - Locust</text>
    </g>
  </g>
</svg>
