<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative Jira delivery management report</title>
  <desc id="desc">A Jira-style release readiness dashboard showing flow measures, delivery risks, and management decisions.</desc>
  <rect width="1280" height="760" fill="#f4f5f7"/>
  <rect width="230" height="760" fill="#0747a6"/>
  <text x="32" y="55" fill="white" font-family="Arial" font-size="26" font-weight="700">Jira</text>
  <text x="32" y="105" fill="#deebff" font-family="Arial" font-size="13" font-weight="700">QUALITY DELIVERY</text>
  <g fill="#deebff" font-family="Arial" font-size="16"><text x="48" y="158">Overview</text><text x="48" y="202">Active sprint</text><text x="48" y="246">Releases</text><text x="48" y="290">Reports</text><text x="48" y="334">Documentation</text></g>
  <text x="270" y="55" fill="#172b4d" font-family="Arial" font-size="13" font-weight="700">ILLUSTRATIVE MANAGEMENT VIEW · SAMPLE DATA</text>
  <text x="270" y="101" fill="#172b4d" font-family="Arial" font-size="32" font-weight="700">Release readiness &amp; delivery risk</text>
  <text x="270" y="132" fill="#5e6c84" font-family="Arial" font-size="16">Checkout platform · Sprint 32 · Decision review</text>
  <g font-family="Arial"><g transform="translate(270 170)"><rect width="210" height="105" rx="8" fill="white" stroke="#dfe1e6"/><text x="20" y="32" fill="#5e6c84" font-size="13">SPRINT PROGRESS</text><text x="20" y="72" fill="#172b4d" font-size="30" font-weight="700">82%</text></g><g transform="translate(500 170)"><rect width="210" height="105" rx="8" fill="white" stroke="#dfe1e6"/><text x="20" y="32" fill="#5e6c84" font-size="13">BLOCKED</text><text x="20" y="72" fill="#de350b" font-size="30" font-weight="700">1 issue</text></g><g transform="translate(730 170)"><rect width="210" height="105" rx="8" fill="white" stroke="#dfe1e6"/><text x="20" y="32" fill="#5e6c84" font-size="13">MEDIAN CYCLE TIME</text><text x="20" y="72" fill="#172b4d" font-size="30" font-weight="700">3.5 days</text></g><g transform="translate(960 170)"><rect width="210" height="105" rx="8" fill="white" stroke="#dfe1e6"/><text x="20" y="32" fill="#5e6c84" font-size="13">RELEASE SIGNAL</text><rect x="20" y="51" width="92" height="30" rx="15" fill="#ffab00"/><text x="42" y="72" fill="#172b4d" font-size="13" font-weight="700">WATCH</text></g></g>
  <rect x="270" y="305" width="580" height="385" rx="10" fill="white" stroke="#dfe1e6"/><text x="294" y="345" fill="#172b4d" font-family="Arial" font-size="20" font-weight="700">Delivery flow</text>
  <g font-family="Arial" font-size="13" fill="#5e6c84"><text x="294" y="385">TO DO · 3</text><text x="474" y="385">IN PROGRESS · 2/2</text><text x="674" y="385">REVIEW · 1/2</text></g>
  <g font-family="Arial"><rect x="294" y="405" width="160" height="95" rx="6" fill="#f4f5f7" stroke="#dfe1e6"/><text x="310" y="432" fill="#0052cc" font-size="12" font-weight="700">PAY-142</text><text x="310" y="461" fill="#172b4d" font-size="15" font-weight="700">Guest checkout</text><text x="310" y="486" fill="#5e6c84" font-size="12">Age: 1 day</text><rect x="474" y="405" width="180" height="115" rx="6" fill="#fff7e6" stroke="#ffab00"/><text x="490" y="432" fill="#de350b" font-size="12" font-weight="700">BLOCKED · API-88</text><text x="490" y="461" fill="#172b4d" font-size="15" font-weight="700">Payment contract</text><text x="490" y="486" fill="#5e6c84" font-size="12">Age: 6 days</text><rect x="674" y="405" width="150" height="95" rx="6" fill="#e3fcef" stroke="#36b37e"/><text x="690" y="432" fill="#006644" font-size="12" font-weight="700">QA-219</text><text x="690" y="461" fill="#172b4d" font-size="15" font-weight="700">Tax boundary</text><text x="690" y="486" fill="#5e6c84" font-size="12">Evidence linked</text></g>
  <rect x="880" y="305" width="290" height="385" rx="10" fill="white" stroke="#dfe1e6"/><text x="904" y="345" fill="#172b4d" font-family="Arial" font-size="20" font-weight="700">Management summary</text>
  <g font-family="Arial"><text x="904" y="388" fill="#de350b" font-size="13" font-weight="700">PRIMARY RISK</text><text x="904" y="416" fill="#172b4d" font-size="15">Payment API contract is</text><text x="904" y="440" fill="#172b4d" font-size="15">blocked and ageing.</text><line x1="904" y1="470" x2="1146" y2="470" stroke="#dfe1e6"/><text x="904" y="505" fill="#0052cc" font-size="13" font-weight="700">DECISION</text><text x="904" y="533" fill="#172b4d" font-size="15">Hold scope pull. Resolve API-88</text><text x="904" y="557" fill="#172b4d" font-size="15">before release candidate.</text><line x1="904" y1="587" x2="1146" y2="587" stroke="#dfe1e6"/><text x="904" y="622" fill="#006644" font-size="13" font-weight="700">DOCUMENTATION</text><text x="904" y="650" fill="#172b4d" font-size="15">Release checklist · linked</text></g>
</svg>
